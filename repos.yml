# Sources agrégées avec git-aggregator :  make repos
# Chaque entrée est clonée dans src/ (gitignoré) ; pour figer une version,
# remplacer la branche par un SHA/tag dans "merges".
#
# `target` : git-aggregator se place toujours sur cette branche locale (checkout -B)
# puis la remet À L'ÉTAT du premier merge (reset --hard) : les commits non poussés
# de cette branche sont perdus. Il porte ici le nom de la vraie branche (et non
# « aggregated »), pour commiter et pousser dans src/<dossier> sans renommer.

./src/odoo:
  defaults:
    depth: 1
  remotes:
    odoo: https://github.com/odoo/odoo.git
  merges:
    - odoo 18.0
  target: odoo 18.0

./src/oca-server-tools:
  defaults:
    depth: 1
  remotes:
    oca: https://github.com/OCA/server-tools.git
  merges:
    - oca 18.0
  target: oca 18.0

# Modules Odoo kpiten (kpiten, kpiten_demo, erp_demo_*, ...)
./src/kpiten-addons:
  remotes:
    akretion: git@github.com:akretion/kpiten.git
  merges:
    - akretion odoo-multiversion
  target: akretion odoo-multiversion

# Une série antérieure : les vues (écrites pour Odoo 18) sont converties par
# scripts/downgrade.py, qui change aussi la version des manifests.
# ./src/kpiten-addons-16:
#   remotes:
#     akretion: git@github.com:akretion/kpiten.git
#   merges:
#     - akretion odoo-multiversion
#   target: akretion 16.0
#   shell_command_after:
#     - python3 scripts/downgrade.py 16.0
#     - git add . && git commit -m "downgrade to 16.0"

# Une série plus récente : scripts/upgrade.py (droits en ir.access pour la 20).
# La branche 20.0 est toujours reconstruite depuis odoo-multiversion (18), jamais
# modifiée à la main : le Python des différences passe par kpiten/compat.py.
./src/kpiten-addons-20:
  remotes:
    akretion: git@github.com:akretion/kpiten.git
  merges:
    - akretion odoo-multiversion
  target: akretion 20.0
  shell_command_after:
    - python3 scripts/upgrade.py 20.0
    - git add . && git commit -m "upgrade to 20.0"

# Applications Python (uv sync dans chaque dossier)
# the syntax of the KPI (schema, validation), standard library only : Odoo validates
# the tiles with it, without kpiten-core
./src/kpiten-spec:
