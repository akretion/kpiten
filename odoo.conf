[options]
; Chemins relatifs à la racine de bi/ : lancer Odoo depuis ce dossier (make run).
addons_path = src/odoo/odoo/addons,src/odoo/addons,src/oca-server-tools,src/kpiten-addons
data_dir = data/odoo

db_host = localhost
db_port = 5432
db_user = odoo
; db_password volontairement absent : utiliser PGPASSWORD ou ~/.pgpass.

http_port = 8069
workers = 0
; Multi-bases : ne pas définir db_name (ni lancer avec -d, qui limite Odoo à cette
; base). list_db affiche le sélecteur de base, dbfilter (regex) les bases visibles :
; toutes par défaut, par ex. '^(big|dash)$' pour n'en exposer que deux.
list_db = True
dbfilter = .*
server_wide_modules = base,web
log_level = info
