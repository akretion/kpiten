[project]
authors = [
  {name = "David Beal", email = "david.beal@akretion.com"},
]
dependencies = [
  "dotenv>=0.9.9",
  "odoorpc>=0.10.1",
  "polars>=1.39.3",
  "pyarrow>=23.0.1",
  "plotly[express]>=6.7.0",
  "great-tables>=0.21.0",
  "tomli-w>=1.0",
  "requests>=2.34.2",
]
description = "Framework agnostic core to compute KPI tiles stored in Odoo (kpiten)"
name = "kpiten-core"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.3,<0.12.0"]

[dependency-groups]
dev = [
  "black>=26.5.1",
  "pytest>=8",
]
