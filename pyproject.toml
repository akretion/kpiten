[project]
authors = [
  {name = "David Beal", email = "david.beal@akretion.com"},
]
dependencies = [
  "dotenv>=0.9.9",
  "odoorpc>=0.10.1",
  "polars>=1.39.3",
  "pyarrow>=23.0.1",
  "connectorx>=0.3.2",
  "tomli-w>=1.0",
  "requests>=2.34.2",
  "sqlglot>=30.19.0",
  "pluggy>=1.6.0",
  # the syntax of the KPI (its schema, the validation) : shared with the Odoo modules
  "kpiten-spec",
]
description = "Framework agnostic core to compute KPI tiles stored in Odoo (kpiten)"
name = "kpiten-core"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

# drawing the results : plotly figures, great_tables tables (kpiten_core.render) ; the
# fronts that draw with them ask for it : kpiten-core[render]
[project.optional-dependencies]
render = [
  "plotly[express]>=6.7.0",
  "great-tables>=0.21.0",
]
# Claude as the AI model (kpiten_core.llm) ; a local model needs nothing more
ai = [
  "anthropic>=1.7.0",
]

[project.scripts]
kpiten-sync = "kpiten_core.sync:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.3,<0.12.0"]

[dependency-groups]
dev = [
  "kpiten-core[render]",
  "black>=26.5.1",
  "pytest>=8",
  "birdseye>=0.10.0",
  "snoop>=0.6.1",
  "viztracer>=1.1.1",
]

[tool.uv.sources]
kpiten-spec = { path = "../kpiten-spec", editable = true }
