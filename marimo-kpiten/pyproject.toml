[project]
authors = [
  {name = "Maël Salem"},
  {name = "David Beal", email = "david.beal@akretion.com"},
]
dependencies = [
  "altair>=6.1.0",
  "connectorx>=0.4.5",
  "dotenv>=0.9.9",
  "fastapi>=0.135.3",
  "marimo>=0.22.5",
  "odoorpc>=0.10.1", # "pg-autojoin>=0.5.0",
  "polars>=1.39.3",
  "psycopg2-binary>=2.9.12",
  "pyarrow>=23.0.1",
  "requests>=2.33.1",
  "urllib3>=2.7.0",
  "uvicorn>=0.44.0",
  "werkzeug>=3.1.8",
]
description = "Use marimo data exploration capabilities & dashboarding"
name = "marimo-kpiten"
readme = "README.md"
requires-python = ">=3.12"
version = "0.5.0"

[project.scripts]
marimo-kpiten = "marimo_kpiten:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.3,<0.12.0"]

[dependency-groups]
dev = [
    "marimo>=0.23.4",
]

